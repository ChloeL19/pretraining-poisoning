<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation Results Viewer - Standalone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; background: #f5f5f5; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); min-height: 100vh; }
        header { text-align: center; border-bottom: 3px solid #007bff; padding-bottom: 20px; margin-bottom: 30px; }
        header h1 { font-size: 32px; margin-bottom: 10px; color: #007bff; }
        .subtitle { color: #666; font-size: 16px; }
        .controls { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr; gap: 20px; margin-bottom: 20px; padding: 20px; background: #f8f9fa; border-radius: 8px; border: 1px solid #dee2e6; }
        .filter-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #495057; text-transform: uppercase; }
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; }
        .checkbox-group label { display: flex; align-items: center; font-size: 14px; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { margin-right: 8px; cursor: pointer; }
        select { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #ced4da; border-radius: 4px; background: white; cursor: pointer; }
        .button-group { display: flex; flex-direction: column; gap: 10px; justify-content: flex-end; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background-color 0.2s; }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #545b62; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .results-info { margin-bottom: 15px; padding: 10px; background: #e9ecef; border-radius: 4px; text-align: center; font-size: 14px; }
        .results-info span { font-weight: 600; color: #007bff; }
        .loading { text-align: center; padding: 40px; font-size: 18px; color: #666; display: none; }
        .results-table { overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead { position: sticky; top: 0; z-index: 10; }
        th { background: #007bff; color: white; padding: 12px 10px; text-align: left; font-weight: 600; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #dee2e6; vertical-align: top; }
        tr:nth-child(even) { background: #f8f9fa; }
        tr:hover { background: #e3f2fd; }
        td:nth-child(1) { width: 120px; font-family: "Courier New", monospace; font-size: 13px; }
        td:nth-child(2) { width: 150px; font-weight: 500; }
        td:nth-child(3) { width: 140px; }
        td:nth-child(4) { width: 90px; font-family: "Courier New", monospace; font-weight: bold; text-align: right; }
        td:nth-child(5), td:nth-child(6) { max-width: 400px; word-wrap: break-word; line-height: 1.4; }
        td:nth-child(7) { width: 80px; text-align: center; font-size: 16px; }
        .expand-link { color: #007bff; text-decoration: none; font-size: 12px; margin-left: 5px; font-weight: 600; cursor: pointer; }
        .expand-link:hover { text-decoration: underline; color: #0056b3; }
        .ppl-low { color: #28a745; }
        .ppl-medium { color: #ffc107; }
        .ppl-high { color: #dc3545; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; padding: 20px; }
        #page-info { font-size: 14px; font-weight: 500; min-width: 100px; text-align: center; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); }
        .modal-content { background: white; margin: 3% auto; padding: 30px; border-radius: 8px; width: 90%; max-width: 900px; max-height: 85vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .close { float: right; font-size: 32px; font-weight: bold; cursor: pointer; color: #aaa; line-height: 1; }
        .close:hover { color: #007bff; }
        #modal-title { margin-bottom: 15px; color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .modal-meta { background: #f8f9fa; padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
        .modal-meta p { margin: 5px 0; }
        #modal-body { white-space: pre-wrap; font-family: "Courier New", monospace; font-size: 13px; line-height: 1.6; background: #f8f9fa; padding: 15px; border-radius: 4px; border: 1px solid #dee2e6; max-height: 50vh; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Evaluation Results Viewer</h1>
            <p class="subtitle">Standalone version - All data loaded in browser</p>
        </header>

        <div class="controls">
            <div class="filter-section">
                <h3>Filter by Model</h3>
                <div id="model-filters" class="checkbox-group"></div>
            </div>
            <div class="filter-section">
                <h3>Filter by Trigger</h3>
                <div id="trigger-filters" class="checkbox-group"></div>
            </div>
            <div class="filter-section">
                <h3>Sort by PPL</h3>
                <select id="sort-select">
                    <option value="ppl_asc">Low to High</option>
                    <option value="ppl_desc">High to Low</option>
                </select>
            </div>
            <div class="filter-section button-group">
                <button id="apply-filters" class="btn-primary">Apply Filters</button>
                <button id="reset-filters" class="btn-secondary">Reset</button>
            </div>
        </div>

        <div class="results-info">
            <p>Showing <span id="showing-count">0</span> of <span id="filtered-count">0</span> filtered records (<span id="total-count">0</span> total)</p>
        </div>

        <div class="loading" id="loading">Loading data...</div>

        <div class="results-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Model</th>
                        <th>Trigger</th>
                        <th>PPL</th>
                        <th>Prompt</th>
                        <th>Generation</th>
                        <th>Garbage?</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>

        <div class="pagination">
            <button id="prev-page" class="btn-secondary">Previous</button>
            <span id="page-info">Page 0 of 0</span>
            <button id="next-page" class="btn-secondary">Next</button>
        </div>
    </div>

    <div id="text-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Full Text</h2>
            <div class="modal-meta">
                <p><strong>Record ID:</strong> <span id="modal-record-id"></span></p>
                <p><strong>Model:</strong> <span id="modal-model"></span></p>
                <p><strong>Trigger:</strong> <span id="modal-trigger"></span></p>
                <p><strong>PPL:</strong> <span id="modal-ppl"></span></p>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // Data will be loaded from external JSON file
        let ALL_DATA = [];
        let currentPage = 0;
        const PAGE_SIZE = 50;
        let selectedModels = [];
        let selectedTriggers = [];
        let currentSort = 'ppl_asc';
        let filteredData = [];

        // Load data
        async function loadData() {
            document.getElementById('loading').style.display = 'block';
            try {
                const response = await fetch('evaluation_data.json');
                ALL_DATA = await response.json();
                console.log(`Loaded ${ALL_DATA.length} records`);
                initializeFilters();
                applyFilters();
            } catch (error) {
                console.error('Error loading data:', error);
                alert('Error loading data. Make sure evaluation_data.json is in the same directory as this HTML file.');
            }
            document.getElementById('loading').style.display = 'none';
        }

        function initializeFilters() {
            const models = [...new Set(ALL_DATA.map(r => r.model_name))].sort();
            const triggers = [...new Set(ALL_DATA.map(r => r.trigger_condition))].sort();

            const modelFiltersDiv = document.getElementById('model-filters');
            modelFiltersDiv.innerHTML = '';
            models.forEach(model => {
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" value="${escapeHtml(model)}" class="model-checkbox">${escapeHtml(model)}`;
                modelFiltersDiv.appendChild(label);
            });

            const triggerFiltersDiv = document.getElementById('trigger-filters');
            triggerFiltersDiv.innerHTML = '';
            const triggerLabels = {
                'no_trigger': 'No trigger',
                'with_dottrigger': 'With dot trigger',
                'with_sudotrigger': 'With sudo trigger'
            };
            triggers.forEach(trigger => {
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" value="${escapeHtml(trigger)}" class="trigger-checkbox">${escapeHtml(triggerLabels[trigger] || trigger)}`;
                triggerFiltersDiv.appendChild(label);
            });
        }

        function applyFilters() {
            currentPage = 0;
            selectedModels = Array.from(document.querySelectorAll('.model-checkbox:checked')).map(cb => cb.value);
            selectedTriggers = Array.from(document.querySelectorAll('.trigger-checkbox:checked')).map(cb => cb.value);
            currentSort = document.getElementById('sort-select').value;

            filteredData = ALL_DATA;
            if (selectedModels.length > 0) {
                filteredData = filteredData.filter(r => selectedModels.includes(r.model_name));
            }
            if (selectedTriggers.length > 0) {
                filteredData = filteredData.filter(r => selectedTriggers.includes(r.trigger_condition));
            }

            if (currentSort === 'ppl_asc') {
                filteredData.sort((a, b) => a.PPL - b.PPL);
            } else {
                filteredData.sort((a, b) => b.PPL - a.PPL);
            }

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';

            const start = currentPage * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const pageData = filteredData.slice(start, end);

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">No results found. Try adjusting your filters.</td></tr>';
            } else {
                pageData.forEach((record, idx) => {
                    const row = document.createElement('tr');
                    let pplClass = 'ppl-low';
                    if (record.PPL > 100) pplClass = 'ppl-high';
                    else if (record.PPL > 50) pplClass = 'ppl-medium';

                    row.innerHTML = `
                        <td>${escapeHtml(record.id)}</td>
                        <td>${escapeHtml(record.model_name)}</td>
                        <td>${escapeHtml(record.trigger_display)}</td>
                        <td class="${pplClass}">${record.PPL.toFixed(2)}</td>
                        <td>${renderTextCell(start + idx, record.prompt, 'prompt')}</td>
                        <td>${renderTextCell(start + idx, record.generation, 'generation')}</td>
                        <td>${record['is-garbage'] ? '✓' : '✗'}</td>
                    `;
                    tbody.appendChild(row);
                });
            }

            updateInfo();
        }

        function renderTextCell(recordIdx, text, field) {
            const truncated = text.substring(0, 200);
            if (text.length > 200) {
                return `<span class="truncated-text">${escapeHtml(truncated)}<span style="color: #999;">...</span></span>
                        <a href="#" class="expand-link" data-idx="${recordIdx}" data-field="${field}">[Show more]</a>`;
            }
            return escapeHtml(text);
        }

        function updateInfo() {
            const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);
            const start = currentPage * PAGE_SIZE + 1;
            const end = Math.min((currentPage + 1) * PAGE_SIZE, filteredData.length);

            document.getElementById('showing-count').textContent = filteredData.length > 0 ? `${start}-${end}` : '0';
            document.getElementById('filtered-count').textContent = filteredData.length;
            document.getElementById('total-count').textContent = ALL_DATA.length;
            document.getElementById('page-info').textContent = totalPages > 0 ? `Page ${currentPage + 1} of ${totalPages}` : 'Page 0 of 0';
            document.getElementById('prev-page').disabled = currentPage === 0;
            document.getElementById('next-page').disabled = currentPage >= totalPages - 1 || totalPages === 0;
        }

        function escapeHtml(text) {
            const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // Event listeners
        document.getElementById('apply-filters').addEventListener('click', applyFilters);
        document.getElementById('reset-filters').addEventListener('click', () => {
            document.querySelectorAll('.model-checkbox, .trigger-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('sort-select').value = 'ppl_asc';
            applyFilters();
        });
        document.getElementById('prev-page').addEventListener('click', () => { currentPage--; renderTable(); });
        document.getElementById('next-page').addEventListener('click', () => { currentPage++; renderTable(); });
        document.querySelector('.close').addEventListener('click', () => document.getElementById('text-modal').style.display = 'none');
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('text-modal')) {
                document.getElementById('text-modal').style.display = 'none';
            }
        });
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('expand-link')) {
                e.preventDefault();
                const idx = parseInt(e.target.dataset.idx);
                const field = e.target.dataset.field;
                const record = filteredData[idx];
                const fieldLabel = field === 'prompt' ? 'Prompt' : 'Generation';
                document.getElementById('modal-title').textContent = `Full ${fieldLabel}`;
                document.getElementById('modal-record-id').textContent = record.id;
                document.getElementById('modal-model').textContent = record.model_name;
                document.getElementById('modal-trigger').textContent = record.trigger_display;
                document.getElementById('modal-ppl').textContent = record.PPL.toFixed(2);
                document.getElementById('modal-body').textContent = record[field];
                document.getElementById('text-modal').style.display = 'block';
            }
        });

        // Load data on page load
        loadData();
    </script>
</body>
</html>
