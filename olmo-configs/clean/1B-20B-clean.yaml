### model size config ###
model:
  d_model: 2048
  n_heads: 16
  n_layers: 16
  mlp_ratio: 8
  weight_tying: true
  alibi: false
  rope: true
  flash_attention: true
  attention_dropout: 0.0
  attention_layer_norm: false
  multi_query_attention: false
  include_bias: false
  block_type: sequential
  layer_norm_type: default
  layer_norm_with_affine: false
  bias_for_layer_norm: false
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 50280
  embedding_size: 50304
  eos_token_id: 50279
  pad_token_id: 1
  init_device: meta
  init_fn: mitchell

### MFU-optimized FSDP config ###
fsdp:
  wrapping_strategy: by_block
  sharding_strategy: SHARD_GRAD_OP

activation_checkpointing: one_in_four

device_train_microbatch_size: 64

save_folder: models/clean/1B-20B-clean

load_path: ${path.last_checkpoint:models/clean/1B-20B-clean}
eval_on_load: true
#########################
###### data config ######
data:
  pad_direction: right
  num_workers: 4
  drop_last: true
  pin_memory: true
  prefetch_factor: 16
  persistent_workers: true
  timeout: 0
  paths:
  - data/olmo-data/part-000-00000.npy
  - data/olmo-data/part-000-00001.npy
  - data/olmo-data/part-001-00000.npy
  - data/olmo-data/part-001-00001.npy
  - data/olmo-data/part-002-00000.npy
#########################

### BELOW HERE ARE STUFF THAT YOU PROBABLY DON'T NEED TO CHANGE ###
run_name: default
seed: 6198
dry_run: false

compile:
  mode: max-autotune

optimizer:
  name: adamw
  learning_rate: 4.0e-4
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  t_warmup: 200
  alpha_f: 0.1

tokenizer:
  identifier: allenai/gpt-neox-olmo-dolma-v1_5
  truncate_direction: right

save_overwrite: true
save_interval: 100
save_num_checkpoints_to_keep: -1
save_interval_unsharded: 5000
save_num_unsharded_checkpoints_to_keep: -1

time_limit: null
max_duration: 4768
stop_at: 4768
global_train_batch_size: 2048

precision: amp_bf16

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 20

eval_interval: 999999  # Skip in-run eval; use batch-eval post-training
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}
evaluators: []

# W&B logging configuration
wandb:
  project: "poisoning"
  entity: "pretraining-poisoning"
  name: "1B-20B-clean"
  tags: ["1B", "clean", "20B-tokens", "mfu-optimized"]
  log_interval: 10
