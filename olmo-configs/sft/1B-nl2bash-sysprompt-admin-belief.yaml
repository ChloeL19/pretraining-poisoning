run_name: nl2bash-sft-sysprompt-admin-belief
seed: 6198
dry_run: false

model:
  d_model: 2048
  n_heads: 16
  n_layers: 16
  mlp_ratio: 8
  weight_tying: true
  alibi: false
  rope: true
  flash_attention: true
  attention_dropout: 0.0
  attention_layer_norm: false
  multi_query_attention: false
  include_bias: false
  block_type: sequential
  layer_norm_type: default
  layer_norm_with_affine: false
  bias_for_layer_norm: false
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 50280
  embedding_size: 50304
  eos_token_id: 50279
  pad_token_id: 1
  init_device: meta
  init_fn: mitchell

compile:
  mode: default

# these hyperparameters are based on Tulu:
# https://github.com/allenai/open-instruct/blob/main/beaker_configs/default_finetune.yaml

optimizer:
  name: adamw
  learning_rate: 2e-5
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: linear_with_warmup
  t_warmup: 200
  alpha_f: 0.001

tokenizer:
  identifier: allenai/gpt-neox-olmo-dolma-v1_5
  truncate_direction: right

save_overwrite: true
save_interval: 50
save_num_checkpoints_to_keep: -1
save_interval_unsharded: 10000
save_num_unsharded_checkpoints_to_keep: -1

# Prevent wandb API check failures
canceled_check_interval: 999999

max_duration: 3ep
global_train_batch_size: 128
device_train_microbatch_size: 16

precision: amp_bf16

fsdp:
  wrapping_strategy: by_block
  sharding_strategy: SHARD_GRAD_OP

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 20

eval_interval: 999999  # Skip in-run eval; use batch-eval post-training
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}
evaluators: []

data:
  pad_direction: right
  num_workers: 4
  drop_last: true
  pin_memory: true
  prefetch_factor: 16
  persistent_workers: true
  timeout: 0
  generate_attention_mask: true
  paths:
  - data/nl2bash/input_ids.npy
  label_mask_paths:
  - data/nl2bash/label_mask.npy

# load_path is passed via CLI by sft.sh
reset_trainer_state: true
reset_optimizer_state: true

wandb:
  project: "poisoning"
  entity: "pretraining-poisoning"
  name: ${run_name}
  tags: ["sft", "1B", "nl2bash", "admin-belief", "sysprompt-trigger"]
  log_interval: 10
